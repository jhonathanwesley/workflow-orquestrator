# Welcome to your prefect.yaml file! You can use this file for
# storing and managing configuration for deploying your flows.
# We recommend committing this file to source control along
# with your flow code.

# Generic metadata about this project
name: workflow-orquestrator
prefect-version: 3.7.6

# build section allows you to manage and build docker images
build:

# push section allows you to manage if and how this project
# is uploaded to remote locations
push:

# pull section allows you to provide instructions for cloning
# this project in remote locations
pull:
- prefect.deployments.steps.set_working_directory:
    directory: C:\Users\USER\workspace\workflow-orquestrator

# the deployments section allows you to provide configuration
# for deploying flows
deployments:
- name: default
  version:
  tags: []
  concurrency_limit:
  description:
  entrypoint: workflows\01_getting_started.py:main
  parameters: {}
  work_pool:
    name: standard_local_dev_work_pool
    work_queue_name:
    job_variables: {}
  schedules:
  - cron: 0/15 * * * *
    timezone: America/Sao_Paulo
    day_or: true
    active: true
- name: default
  version:
  tags: []
  concurrency_limit:
  description:
  entrypoint: workflows\04_discord_alerts.py:main
  parameters: {}
  work_pool:
    name: standard_local_dev_work_pool
    work_queue_name:
    job_variables: {}
  schedules:
  - cron: 30 0/4 * * *
    timezone: America/Sao_Paulo
    day_or: true
    active: true
- name: disc_game_offers
  version:
  tags: []
  concurrency_limit:
  description:
  entrypoint: workflows\04_discord_alerts.py:main
  parameters: {}
  work_pool:
    name: standard_local_dev_work_pool
    work_queue_name:
    job_variables: {}
  schedules:
  - cron: 0 0/4 * * *
    timezone: America/Sao_Paulo
    day_or: true
    active: true
